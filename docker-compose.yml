version: "3.8"

# Khởi chạy 1-click cho chế độ "server riêng / đồng bộ đa thiết bị" (PostgreSQL).
# Nếu chỉ chạy local trên 1 máy, dùng SQLite trực tiếp (xem README.md mục
# "Local-only") và KHÔNG cần docker compose.

services:
  db:
    image: postgres:16-alpine
    container_name: ai_opc_db
    environment:
      POSTGRES_DB: company_os
      POSTGRES_USER: founder
      POSTGRES_PASSWORD: supersecretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U founder -d company_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: ai_opc_core
    environment:
      PORT: 8000
      DB_PROVIDER: postgresql
      DATABASE_URL: postgresql://founder:supersecretpassword@db:5432/company_os
      JWT_SECRET: change-me-to-a-long-random-string
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai_opc_cockpit
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
