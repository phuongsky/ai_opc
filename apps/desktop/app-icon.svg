<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6" />
    </filter>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Subtle Grid Texture -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Core AI Node & Orbit Rings -->
  <g filter="url(#neon)">
    <!-- Outer Hex / Shield Core -->
    <path d="M256 120 L370 186 L370 326 L256 392 L142 326 L142 186 Z" 
          fill="none" 
          stroke="url(#glowGrad)" 
          stroke-width="10" 
          stroke-linejoin="round" />

    <!-- Inner Core Diamond -->
    <path d="M256 170 L330 256 L256 342 L182 256 Z" 
          fill="url(#accentGrad)" 
          opacity="0.15" />

    <path d="M256 170 L330 256 L256 342 L182 256 Z" 
          fill="none" 
          stroke="url(#glowGrad)" 
          stroke-width="6" 
          stroke-linejoin="round" />

    <!-- Center Pulse Sphere -->
    <circle cx="256" cy="256" r="28" fill="#38bdf8" />
    <circle cx="256" cy="256" r="16" fill="#ffffff" />

    <!-- Neural Connection Points -->
    <circle cx="256" cy="120" r="8" fill="#38bdf8" />
    <circle cx="370" cy="186" r="8" fill="#6366f1" />
    <circle cx="370" cy="326" r="8" fill="#a855f7" />
    <circle cx="256" cy="392" r="8" fill="#38bdf8" />
    <circle cx="142" cy="326" r="8" fill="#6366f1" />
    <circle cx="142" cy="186" r="8" fill="#a855f7" />
    
    <!-- Connectors -->
    <line x1="256" y1="120" x2="256" y2="170" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="342" x2="256" y2="392" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="142" y1="186" x2="182" y2="256" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
    <line x1="370" y1="186" x2="330" y2="256" stroke="#6366f1" stroke-width="3" stroke-linecap="round" />
    <line x1="142" y1="326" x2="182" y2="256" stroke="#6366f1" stroke-width="3" stroke-linecap="round" />
    <line x1="370" y1="326" x2="330" y2="256" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
